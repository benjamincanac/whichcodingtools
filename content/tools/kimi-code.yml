slug: kimi-code
name: Kimi Code CLI
description: Moonshot AI's terminal agent for the Kimi models, a single binary with a VS Code extension. Logs in with a Kimi membership or a platform key, runs in Zed or JetBrains over ACP.
layer: harness
secondary_layers: [extension]
vendor: Moonshot AI
homepage: https://www.kimi.com/code
links:
  docs: https://moonshotai.github.io/kimi-code/en/
  pricing: https://www.kimi.com/membership/pricing
  repo: https://github.com/MoonshotAI/kimi-code
icon: i-simple-icons-kimi
platforms: [macos, linux, windows]
hosts: [vscode]
install:
  - method: curl
    command: curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash
  - method: npm
    command: npm install -g @moonshot-ai/kimi-code
license:
  spdx: MIT
  kind: open-source
  repo: https://github.com/MoonshotAI/kimi-code
models:
  providers: [moonshot, anthropic, openai, google]
  byok: full
  local: false
  notes: Kimi models through the Kimi Code OAuth login or a platform.kimi.com API key. Anthropic, OpenAI, Google and other compatible providers are configured by hand in config.toml with your own key.
features: [mcp-client, subagents, parallel-agents, hooks, plugins, acp-agent, scheduled-tasks]
pricing:
  tiers:
    - id: adagio
      name: Adagio
      price: 0
      audience: individual
      overage:
        kind: blocked
      limits:
        - One concurrent agent task, 2 scheduled tasks
    - id: plus
      name: Plus
      price: 19
      price_annual: 15
      audience: individual
      overage:
        kind: rate-limited
        notes: Kimi Code has its own five hour and weekly limit separate from the shared membership credits.
      limits:
        - 2 concurrent tasks, 10 scheduled tasks, Kimi Code available
    - id: pro
      name: Pro
      price: 39
      price_annual: 31
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - 2 concurrent tasks, 15 scheduled tasks, goal mode, Kimi Claw deployment
    - id: max
      name: Max
      price: 99
      price_annual: 79
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - 4 concurrent tasks, 20 scheduled tasks, 1M token chat context, goal mode, Kimi Claw deployment
    - id: ultra
      name: Ultra
      price: 199
      price_annual: 159
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - 4 concurrent tasks, 25 scheduled tasks, 1M token chat context, goal mode, Kimi Claw deployment
    - id: api
      name: Platform API pay-as-you-go
      price: null
      audience: individual
      overage:
        kind: api-list
        notes: Pay as you go per million tokens through the Kimi platform API, with a separate rate for each model.
  notes: USD figures are the global kimi.ai prices. Annual billing is $180, $372, $948 and $1,908 a year for Plus, Pro, Max and Ultra. The China site bills in CNY, with Go, Plus, Pro, Max and Ultra as the current plans and Andante, Moderato, Allegretto and Allegro kept as legacy plans.
status: active
sources:
  - url: https://www.kimi.ai/membership/pricing
    verified_at: 2026-10-20
    covers: [pricing]
  - url: https://www.kimi.com/en/help/membership/membership-overview
    verified_at: 2026-10-20
    covers: [pricing]
  - url: https://www.kimi.com/code/docs/
    verified_at: 2026-08-23
    covers: [platforms, models, general]
