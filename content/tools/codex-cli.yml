slug: codex-cli
name: Codex CLI
description: OpenAI's open source terminal agent. Signs in with a ChatGPT account and shares the plan's usage window, or bills an API key at token prices.
layer: harness
secondary_layers: [extension, cloud]
vendor: OpenAI
homepage: https://learn.chatgpt.com/docs/codex/cli
links:
  docs: https://learn.chatgpt.com/docs/codex/cli
  pricing: https://learn.chatgpt.com/docs/pricing
  repo: https://github.com/openai/codex
icon: i-simple-icons-openai
platforms: [macos, linux, windows]
hosts: [vscode]
install:
  - method: npm
    command: npm install -g @openai/codex
  - method: brew
    command: brew install --cask codex
license:
  spdx: Apache-2.0
  kind: open-source
  repo: https://github.com/openai/codex
models:
  providers: [openai]
  byok: full
  local: false
  notes: OpenAI models only. Local models through an OpenAI-compatible endpoint are configurable but unsupported.
features: [worktrees, subagents, mcp-client, hooks, plugins, sandboxing, checkpoints, remote-execution, diff-review, acp-agent]
pricing:
  bundled_with: chatgpt
  tiers:
    - id: free
      name: ChatGPT Free
      price: 0
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - Small allowance for quick tasks, shared with ChatGPT
    - id: go
      name: ChatGPT Go
      price: 8
      audience: individual
      overage:
        kind: rate-limited
    - id: plus
      name: ChatGPT Plus
      price: 20
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - Local message estimates per five-hour window run from 5-45 on GPT-6 Astra to 350-3,000 on GPT-6 Luna
    - id: pro
      name: ChatGPT Pro
      price: 100
      price_from: true
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - Higher Pro price points at $200 and $500 a month, the $500 one adding Astra Ultrafast speed mode access
    - id: business
      name: ChatGPT Business
      price: 25
      price_annual: 20
      audience: team
      overage:
        kind: rate-limited
      limits:
        - Two user minimum
      notes: The $20 annual rate requires 2 or more users.
    - id: api
      name: API key
      price: null
      audience: individual
      overage:
        kind: api-list
        notes: Pay for the tokens Codex uses at API prices. Cloud features are not included.
  notes: Local messages and cloud chats share the plan's usage allowance, and weekly limits may also apply. Plus and Standard Business list local message estimates per five-hour period, and Pro plans currently have no five-hour limit.
status: active
sources:
  - url: https://learn.chatgpt.com/docs/pricing
    verified_at: 2026-10-29
    covers: [pricing, models]
  - url: https://github.com/openai/codex
    verified_at: 2026-10-29
    covers: [platforms, features, license]
  - url: https://learn.chatgpt.com/docs/codex/cli
    verified_at: 2026-10-29
    covers: [general, features]
