slug: blackbox
name: BLACKBOX AI
description: BLACKBOX AI's VS Code extension, CLI and web app with chat, completions and a multi-agent mode that fans one task out to Blackbox, Claude Code, Codex and Gemini.
layer: extension
secondary_layers: [harness, cloud]
vendor: BLACKBOX AI
homepage: https://www.blackbox.ai
links:
  docs: https://docs.blackbox.ai
  pricing: https://www.blackbox.ai/pricing
  x: https://x.com/blackboxai
platforms: [macos, windows, linux, web]
hosts: [vscode]
install:
  - method: download
    url: https://marketplace.visualstudio.com/items?itemName=Blackboxapp.blackbox
  - method: npm
    command: npm install -g @blackbox/cli
  - method: curl
    command: curl -fsSL https://blackbox.ai/install.sh | bash
license:
  spdx: proprietary
  kind: proprietary
  notes: The CLI page says the CLI is open source but links no repository, and the @blackbox/cli package was not on the npm registry on 2026-08-23, so it is recorded as proprietary until a repo turns up.
models:
  providers: [anthropic, openai, google, xai, meta, mistral, moonshot, alibaba, minimax, zhipu]
  byok: none
  local: false
  notes: The VS Code page lists Claude Opus 4.6, GPT-5.2, Gemini 3, Grok 4, Llama and Mistral. The Blackbox Router exposes 300+ models through one endpoint, including Kimi, Qwen, MiniMax, GLM and NVIDIA Nemotron, all billed per token.
features: [mcp-client, parallel-agents, browser-automation, tab-completion, diff-review, hooks, plugins, remote-execution]
pricing:
  tiers:
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      overage:
        kind: api-list
        notes: The contract is quoted against these per-token list rates, for example Nemotron 3 Ultra at $0.32 input and $0.80 output, Kimi K2.7 Code at $0.74 and $3.50. Rates improve further as committed spend grows, about 5 percent off closed models and 10 percent off open models.
      limits:
        - Annual purchase order, committed spend metered per token as it is consumed, unused balance expires at the end of the billing period
        - Dedicated forward-deployed engineer, implementation included at no extra cost
        - Dedicated single-tenant deployment, data residency, guaranteed TPM and custom rate limits
        - SAML SSO, SCIM, RBAC, audit logs, zero data retention under contract and DPA, PII removed before closed models
        - Dedicated Remote Agent runners with SSO, Agents API for cloud coding agents
  notes: The pricing page no longer lists a Free plan or a self-serve pay-per-token tier that were on file before 2026-08-28. Every tier now requires an enterprise commit made through sales, quoted against reference per-token rates; there is no signup that bypasses it. Multi-agent mode dispatches to Claude Code, Codex and Gemini, but the site does not say whether it runs your own installs and logins, so no wraps are recorded.
status: active
sources:
