    verified_at: 2026-08-23
    covers: [features, models, platforms]
  - url: https://www.blackbox.ai/cli
    verified_at: 2026-08-23
    covers: [platforms, features, license]
  - url: https://www.blackbox.ai
    verified_at: 2026-08-23
    covers: [general, platforms]
