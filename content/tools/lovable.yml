    verified_at: 2026-08-23
    covers: [platforms]
  - url: https://docs.lovable.dev/integrations/lovable-mobile-app
    verified_at: 2026-08-23
    covers: [platforms]
  - url: https://docs.lovable.dev/llms.txt
