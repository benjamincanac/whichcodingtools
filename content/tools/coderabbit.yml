slug: coderabbit
name: CodeRabbit
description: Reviews pull requests on GitHub, GitLab, Bitbucket and Azure DevOps, with a CLI and a VS Code extension for pre-commit review. Public repositories are reviewed at no charge.
layer: cloud
secondary_layers: [extension]
vendor: CodeRabbit
homepage: https://www.coderabbit.ai
links:
  docs: https://docs.coderabbit.ai
  pricing: https://www.coderabbit.ai/pricing
icon: i-simple-icons-coderabbit
platforms: [web, macos, linux, windows]
hosts: [vscode]
install:
  - method: download
    url: https://marketplace.visualstudio.com/items?itemName=CodeRabbit.coderabbit-vscode
  - method: curl
    command: curl -fsSL https://cli.coderabbit.ai/install.sh | sh
  - method: brew
    command: brew install coderabbit
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [openai, anthropic]
  byok: none
  local: false
  notes: Reviews run on OpenAI and Anthropic models picked by CodeRabbit. The VS Code extension also works in Cursor, Windsurf and other VS Code based editors, and the CLI plugs into Claude Code, Codex, Cursor and Gemini as a reviewer.
features: [diff-review, mcp-client]
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      trial_days: 14
      overage:
        kind: rate-limited
      limits:
        - 1 PR summary per hour, 3 IDE and 3 CLI reviews per developer per hour, 150 files per review
        - Unlimited public and private repositories, no credit card
      notes: Starts as a 14 day Advanced trial, then drops to summaries and the lower limits.
    - id: oss
      name: Open source
      price: 0
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - Team features on public repositories, 1 to 10 PR reviews per hour depending on stars, 100 to 300 files per review
    - id: essentials
      name: Essentials
      price: 30
      price_annual: 24
      audience: team
      trial_days: 14
      overage:
        kind: credits
        notes: Usage-based add-on for reviews above the hourly limit, $0.25 per reviewed file.
      limits:
        - 5 PR, 5 IDE and 5 CLI reviews per developer per hour, 150 files per review, 50 chat messages per hour
        - 5 MCP connections, 1 multi-repo analysis repository, pre-merge checks, Jira and Linear
      notes: Previously called Pro, same price.
    - id: team
      name: Team
      price: 60
      price_annual: 48
      audience: team
      trial_days: 14
      overage:
        kind: credits
        notes: Usage-based add-on for reviews above the hourly limit, $0.25 per reviewed file.
      limits:
        - 8 PR, 8 IDE and 8 CLI reviews per developer per hour, 300 files per review, 75 chat messages per hour
        - 10 MCP connections, 5 multi-repo analysis repositories, custom pre-merge checks, unit tests, merge conflict resolution, coding plans, Triage
      notes: Previously called Pro+, same price. Existing Pro+ customers keep their old 10 reviews per hour allowance.
    - id: advanced
      name: Advanced
      price: 90
      price_annual: 72
      audience: team
      trial_days: 14
      overage:
        kind: credits
        notes: Usage-based add-on for reviews above the hourly limit, $0.25 per reviewed file.
      limits:
        - 10 PR, 10 IDE and 10 CLI reviews per developer per hour, 300 files per review, 100 chat messages per hour
        - 15 MCP connections, 10 multi-repo analysis repositories, continuous security monitoring of your repositories, security review of each PR
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      overage:
        kind: credits
      limits:
        - 12 PR, 12 IDE and 12 CLI reviews per developer per hour, 300 files per review, 100 chat messages per hour
        - 20 MCP connections, 20 multi-repo analysis repositories, self-hosting, SSO, RBAC, audit logs, API access
  notes: Per seat, seats can be reassigned between developers. Annual billing saves 20 percent. CodeRabbit Security Scan uses variable pricing based on the scan, not a flat fee. CodeRabbit Agent covers cloud coding tasks, Slack and automations, and bills 40 cents per agent minute, after trial and free minutes are used.
status: active
