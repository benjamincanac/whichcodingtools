slug: grok-build
name: Grok Build
description: xAI's terminal coding agent, a fullscreen TUI in Rust that edits files, runs commands and spawns subagents. Signs in with a grok.com account or an API key, headless or over ACP.
layer: harness
vendor: xAI (SpaceXAI)
homepage: https://x.ai/cli
links:
  docs: https://docs.x.ai/build/overview
  pricing: https://grok.com/plans
  changelog: https://x.ai/build/changelog
  repo: https://github.com/xai-org/grok-build
platforms: [macos, linux, windows]
install:
  - method: curl
    command: curl -fsSL https://x.ai/cli/install.sh | bash
license:
  spdx: Apache-2.0
  kind: open-source
  repo: https://github.com/xai-org/grok-build
  notes: First party code is Apache-2.0. Vendored ports of codex and opencode keep their own licenses in the repo notices.
models:
  providers: [xai, anthropic, openai]
  byok: full
  local: true
  notes: Defaults to xAI hosted Grok models. Custom endpoints accept OpenAI Chat Completions, Responses or Anthropic Messages protocols with your own key, including Ollama and other local servers.
features: [subagents, parallel-agents, mcp-client, acp-agent, plugins, hooks, sandboxing]
pricing:
  bundled_with: grok
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      overage:
        kind: rate-limited
      limits:
        - One weekly usage pool shared across Grok chat, Build and API
    - id: supergrok-lite
      name: SuperGrok Lite
      price: 10
      price_annual: 8.33
      audience: individual
      overage:
        kind: credits
        notes: Extra Usage Credits can be bought on the web on any paid plan once the weekly pool is spent, they expire one year after purchase.
      limits:
        - Basic chat access, 2x longer conversations, increased limits at regular speed
    - id: supergrok
      name: SuperGrok
      price: 30
      price_annual: 25
      audience: individual
      overage:
        kind: credits
        notes: Extra Usage Credits bought on the web once the weekly pool is spent, they expire one year after purchase.
      limits:
        - Higher weekly pool, Grok 4.6
    - id: supergrok-plus
      name: SuperGrok Plus
      price: 100
      price_annual: 83.33
      audience: individual
      overage:
        kind: credits
      limits:
        - Significantly higher usage across Chat, Imagine, Voice and Build, priority at peak times, early access
    - id: supergrok-heavy
      name: SuperGrok Heavy
      price: 300
      price_annual: 250
      audience: individual
      overage:
        kind: credits
      limits:
        - Highest usage at the fastest speed, larger team of agents collaborating on answers, X Premium+ included
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
    - id: api
      name: API pay-as-you-go
      price: null
      audience: individual
      overage:
        kind: api-list
        notes: Bill a console.x.ai key at list price, Grok 4.6 is $2 input and $6 output per million tokens under 200k context.
  notes: Annual plans are billed annually at the rates shown.
status: active
sources:
