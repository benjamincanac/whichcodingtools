slug: minimax-code
name: MiniMax Code
description: MiniMax's open source terminal coding agent, with ACP and headless modes. A closed-source desktop companion app adds Agent Team, memory and scheduled tasks.
layer: harness
secondary_layers: [app]
vendor: MiniMax
homepage: https://agent.minimax.io/download
links:
  docs: https://agent.minimax.io/docs/code/welcome
  pricing: https://www.minimax.io/m-plan
  changelog: https://agent.minimax.io/docs/changelog
  repo: https://github.com/MiniMax-AI/minimax-code
icon: i-simple-icons-minimax
platforms: [macos, linux, windows]
install:
  - method: curl
    command: curl -fsSL https://filecdn.minimax.chat/public/install.sh | bash
  - method: npm
    command: npm install -g @minimax-ai/code
  - method: download
    url: https://agent.minimax.io/download
license:
  spdx: MIT
  kind: open-source
  repo: https://github.com/MiniMax-AI/minimax-code
  notes: 'The repo README: "First-party code defaults to MIT" and "The published source covers the terminal TUI, headless CLI, and ACP; it does not include the desktop application''s source." The desktop app is a separate binary distributed from agent.minimax.io/download.'
models:
  providers: [minimax]
  byok: full
  local: false
  notes: Runs directly on a MiniMax Token Plan subscription by default, no API key required. BYOK does not require a MiniMax login either, a custom provider can be added over an openai-completions, openai-responses or anthropic-messages compatible endpoint.
features: [subagents, mcp-client, acp-agent, plugins, scheduled-tasks, mobile-companion, browser-automation, diff-review, checkpoints]
pricing:
  tiers:
    - id: go
      name: Go
      price: 22
      audience: individual
      limits:
        - For light use
        - Text, image and speech models, web search and multimodal understanding, no video model
        - MiniMax Code on web, desktop, TUI, iOS and Android, plus an API key for AI agents and coding tools
      notes: Billed yearly the page lists $220/year, shown next to $264/year.
    - id: explore
      name: Explore
      price: 55
      audience: individual
      limits:
        - 3× Go usage
        - H3 video model, not in Go
      notes: Billed yearly the page lists $550/year, shown next to $648/year.
    - id: build
      name: Build
      price: 132
      audience: individual
      limits:
        - 7.5× Go usage
        - H3 video model
        - Priority access during peak hours and early access to new features
      notes: Billed yearly the page lists $1,320/year, shown next to $1,560/year.
  notes: MiniMax Code, the AI agent app, is included with M Plan, with no extra subscription or API key to set up. One-time credit packs are also sold, Starter $5 for 5,000 credits, Growth $25 for 25,000 credits, High Volume $100 for 100,000 credits, valid for one year.
status: active
