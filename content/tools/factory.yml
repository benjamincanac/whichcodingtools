slug: factory
name: Factory
description: Factory's Droid agent runs from the terminal, a desktop app, the web and Slack, on your machine or managed Droid Computers, with models from several vendors and BYOK.
layer: cloud
secondary_layers: [harness, app]
vendor: Factory
homepage: https://factory.ai
links:
  docs: https://docs.factory.ai
  pricing: https://factory.ai/pricing
platforms: [macos, linux, windows, web]
install:
  - method: curl
    command: curl -fsSL https://app.factory.ai/cli | sh
  - method: brew
    command: brew install --cask droid
  - method: npm
    command: npm install -g droid
  - method: download
    url: https://docs.factory.ai/factory-app/quickstart
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [anthropic, openai, google, xai, zhipu, moonshot, deepseek, minimax]
  byok: partial
  local: true
  notes: Custom models and your own keys work in the Droid CLI and the desktop app only, not in the hosted web or mobile surfaces. BYOK is free up to an allowance on individual plans.
features: [subagents, mcp-client, hooks, plugins, sandboxing, browser-automation, parallel-agents, scheduled-tasks, remote-execution, diff-review, mobile-companion]
pricing:
  tiers:
    - id: pro
      name: Pro
      price: 20
      audience: individual
      overage:
        kind: credits
        notes: Extra Usage is prepaid credit, $10 minimum, no expiry. Droid Core open models keep working after premium rate limits are hit.
      limits:
        - Rolling 5-hour, 7-day and 30-day rate limits
        - Factory App, Droid CLI and Droid SDK
    - id: plus
      name: Plus
      price: 100
      audience: individual
      overage:
        kind: credits
      limits:
        - About 5x the Pro usage
        - Managed Droid Computers for remote runs
    - id: max
      name: Max
      price: 200
      audience: individual
      overage:
        kind: credits
      limits:
        - About 10x the Pro usage
        - Early access to new features
    - id: business
      name: Business
      price: null
      contact_sales: true
      audience: team
      limits:
        - Up to 150 seats, custom usage limits, SSO, SAML/SCIM, zero data retention
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Unlimited seats, dedicated compute, on-premise deployment, data residency
  notes: Usage is counted in Factory Standard Credits with a per-model multiplier. Organization plans use contract limits instead of the rolling rate limits.
status: active
sources:
