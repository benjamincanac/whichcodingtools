slug: cmux
name: cmux
description: Native macOS terminal on libghostty with vertical tabs, notification rings and a scriptable browser for running Claude Code, Codex, Gemini and other CLI agents at once.
layer: orchestrator
vendor: Manaflow
homepage: https://cmux.com
links:
  docs: https://cmux.com/docs/getting-started
  pricing: https://cmux.com/pricing
  repo: https://github.com/manaflow-ai/cmux
platforms: [macos, ios]
install:
  - method: download
    url: https://cmux.com
  - method: brew
    command: brew tap manaflow-ai/cmux && brew install --cask cmux
license:
  spdx: GPL-3.0-or-later
  kind: open-source
  repo: https://github.com/manaflow-ai/cmux
  notes: GPL-3.0-or-later. Commercial terms may be available for the portions Manaflow controls.
models:
  byok: full
  local: false
  notes: Inherits whatever the wrapped agent is signed in with. Pro adds CodeRouter to route across provider accounts.
features: [parallel-agents, browser-automation, remote-execution, mobile-companion]
wraps:
  - tool: claude-code
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs your installed Claude Code in a terminal pane with its existing login.
  - tool: codex-cli
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: gemini-cli
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: cursor
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs the Cursor CLI agent with your Cursor account.
  - tool: opencode
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: aider
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: cline
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs the Cline CLI.
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      overage:
        kind: blocked
      limits:
        - Native terminal, every CLI agent with your own keys, browser panels, socket API, skills
        - Local session history, no Cloud VMs
    - id: pro
      name: Pro
      price: 50
      per: flat
      audience: individual
      overage:
        kind: blocked
      limits:
        - Cloud agents on Cloud VMs, up to 5 Cloud VMs sharing 20 vCPUs and 40 GB RAM
        - Unlimited workspaces
        - The cmux iOS app and email support
    - id: max
      name: Max
      price: 200
      per: flat
      audience: individual
      overage:
        kind: blocked
      limits:
        - Everything in Pro, plus up to 5 Cloud VMs sharing 80 vCPUs and 160 GB RAM
        - Largest Cloud VM 64 GB RAM, versus 32 GB RAM on Pro and Team
    - id: team
      name: Team
      price: 60
      audience: team
      overage:
        kind: blocked
      limits:
        - Centralized billing for your whole team
        - Up to 5 Cloud VMs per paid seat, sharing 20 vCPUs and 40 GB RAM per paid seat across the team
        - Priority support
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      notes: Self-hosted Cloud execution and networking, SSO and SAML sign-in, centralized admin and shared team rules, audit logs, custom VM limits and volume pricing, SOC 2 and an SLA.
  notes: The terminal itself is free and open source. Pro and Team include up to 5 Cloud VMs, per paid seat on Team, sharing 20 vCPUs and 40 GB RAM (per paid seat on Team). Max shares a total of 80 vCPUs and 160 GB RAM across its Cloud VMs instead, with a largest Cloud VM of 64 GB RAM against 32 GB on Pro and Team. goose, Kiro and Amp also run. A one time Founders Edition is also sold for early access. The iOS app is in beta on TestFlight.
status: active
sources:
  - url: https://cmux.com/pricing
    verified_at: 2026-10-06
    covers: [pricing]
  - url: https://cmux.com
    verified_at: 2026-08-23
    covers: [platforms, features, wraps, general]
  - url: https://cmux.com/docs/getting-started
    verified_at: 2026-08-23
    covers: [platforms, features]
  - url: https://github.com/manaflow-ai/cmux
    verified_at: 2026-08-23
    covers: [license, features]
