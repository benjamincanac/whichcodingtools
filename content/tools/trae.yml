slug: trae
name: Trae
description: ByteDance's VS Code based IDE, now called TraeCode. IDE mode keeps you in control, SOLO mode lets the agent plan, code, test and preview. Plans include a monthly dollar balance.
layer: editor
vendor: ByteDance
homepage: https://www.trae.ai
links:
  docs: https://docs.trae.ai/ide/what-is-trae
  pricing: https://www.trae.ai/pricing
icon: i-simple-icons-trae
platforms: [macos, windows, linux]
install:
  - method: download
    url: https://www.trae.ai
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [first-party, openai, google, minimax, moonshot, anthropic, deepseek, xai, openrouter, vercel-ai-gateway]
  byok: full
  local: true
  notes: Built-in GPT-5.4 and 5.2, Gemini 3.1 Pro and 3 Flash, Seed-2.1-Turbo, MiniMax M3 and M2.7 and Kimi K2.5. GPT and MiniMax are not offered to US users. Custom models with your own key from Google, OpenAI, DeepSeek, Anthropic, xAI, OpenRouter, Vercel AI Gateway, Azure, AWS, Ollama and others, or any OpenAI or Anthropic compatible endpoint.
features: [mcp-client, tab-completion, sandboxing, remote-execution, diff-review, hooks]
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      limits:
        - Auto mode only
        - Limited usage
        - Limited Autocomplete, 5000 per month
        - Up to 2 concurrent cloud tasks
    - id: pro
      name: Pro
      price: 20
      price_annual: 16.67
      audience: individual
      trial_days: 7
      included:
        amount: 20
        unit: usd
        usd_value: 20
      overage:
        kind: api-list
      limits:
        - Auto and all models
        - Unlimited Autocomplete
        - Up to 10 concurrent cloud tasks
    - id: pro-plus
      name: Pro+
      price: 60
      price_annual: 50
      audience: individual
      included:
        amount: 60
        unit: usd
        usd_value: 60
      overage:
        kind: api-list
      limits:
        - 3x the Pro usage
        - Up to 15 concurrent cloud tasks
    - id: ultra
      name: Ultra
      price: 200
      price_annual: 166.67
      audience: individual
      included:
        amount: 200
        unit: usd
        usd_value: 200
      overage:
        kind: api-list
      limits:
        - 10x the Pro usage
        - Model early access
        - Up to 20 concurrent cloud tasks
  notes: Model calls convert token cost into dollar usage deducted from the monthly balance. Yearly billing is advertised at 17 percent less. The 7-day Pro trial applies to accounts created on or after February 1, 2026. Enterprise goes through BytePlus.
status: active
sources:
  - url: https://www.trae.ai/pricing
    verified_at: 2026-10-28
    covers: [pricing]
