slug: amp
name: Amp
description: Sourcegraph's terminal agent. Low, medium, high and ultra modes pick the model per task, subagents run in parallel, orbs run threads on remote machines.
layer: harness
secondary_layers: [extension]
vendor: Sourcegraph
homepage: https://ampcode.com
links:
  docs: https://ampcode.com/manual
  pricing: https://ampcode.com/pricing
  changelog: https://ampcode.com/news
icon: i-simple-icons-sourcegraph
platforms: [macos, linux, windows]
hosts: [vscode, neovim, zed, jetbrains]
install:
  - method: curl
    command: curl -fsSL https://ampcode.com/install.sh | bash
  - method: brew
    command: brew install ampcode/tap/ampcode
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [openai, anthropic]
  plans: [chatgpt]
  byok: partial
  local: false
  notes: Amp picks models per mode, GPT-5.6 Sol in high mode, Claude Fable 5 with your own Anthropic key once data retention is enabled on the key's workspace. Linking a ChatGPT subscription adds GPT-5.6 usage. Windows runs through WSL. The JetBrains plugin is deprecated and no longer updated.
features: [subagents, parallel-agents, mcp-client, browser-automation, remote-execution, scheduled-tasks, plugins]
pricing:
  tiers:
    - id: hobby
      name: Hobby
      price: 0
      audience: individual
      overage:
        kind: api-list
      limits:
        - Use your own runners for free
        - Use your ChatGPT subscription and other subscriptions
        - Bring your own keys (BYOK), no Amp token fees or limits
        - Public/private repositories
      notes: The March 30, 2026 news post describes a $10 daily usage grant, ad-free, kept for existing accounts and paused or reduced for some users since May 2026.
    - id: megawatt
      name: Megawatt
      price: 20
      audience: individual
      overage:
        kind: api-list
      limits:
        - 45,000 minutes of orbin' time
        - Use your ChatGPT subscription and other subscriptions
        - Bring your own keys (BYOK), no Amp token fees or limits
        - Unlimited public/private repositories
        - Use your own domains for portals
      notes: Students and teachers pay $10 a month for Megawatt. A paid tier includes orbin' time and Amp credits for inference on all models.
    - id: gigawatt
      name: Gigawatt
      price: 200
      audience: individual
      overage:
        kind: api-list
      limits:
        - 480,000 minutes of orbin' time
        - Use your ChatGPT subscription and other subscriptions
        - Bring your own keys (BYOK), no Amp token fees or limits
        - Unlimited public/private repositories
        - Use your own domains for portals
    - id: teams
      name: Teams
      price: 0
      per: flat
      audience: team
      notes: No extra charge for creating a workspace. Members can be on Hobby, Megawatt, or Gigawatt, and billing is shared and pooled.
      limits:
        - Members can be on different tiers, Hobby, Megawatt, or Gigawatt
        - Team thread sharing, multiplayer, and permissions
        - Shared portals, plugins, and skills
        - User management, controls, and analytics
        - Shared billing and pooled credits
        - SAML/OIDC SSO
        - Shared BYOK and model routing
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Pooled credits only, no paid user seats
        - SCIM user directory sync
        - Spend limits and reporting
        - Audit logs and network/MCP access controls
        - IP allowlisting and regional endpoints
        - Higher resource quotas and rate limits
        - Priority support, invoicing, and custom terms
        - Forward-Deployed Engineering help available
status: active
sources:
  - url: https://ampcode.com/pricing
    verified_at: 2026-09-13
    covers: [pricing]
  - url: https://ampcode.com/manual
    verified_at: 2026-08-23
    covers: [platforms, models, features, general]
  - url: https://ampcode.com/news/amp-free-is-ad-free
    verified_at: 2026-09-13
    covers: [pricing]
