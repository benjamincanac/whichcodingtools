slug: conductor
name: Conductor
description: A Mac app that runs Claude Code, Codex and Cursor agents side by side, one git worktree per workspace, with your own subscriptions and keys.
layer: orchestrator
vendor: Conductor
homepage: https://conductor.build
links:
  docs: https://docs.conductor.build
  pricing: https://conductor.build/pricing
  changelog: https://conductor.build/changelog
platforms: [macos]
install:
  - method: download
    url: https://conductor.build
  - method: brew
    command: brew install --cask conductor
license:
  spdx: proprietary
  kind: proprietary
models:
  byok: full
  local: false
  notes: Inherits whatever the wrapped agent is signed in with.
features: [parallel-agents, worktrees, diff-review, remote-execution]
wraps:
  - tool: claude-code
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs your installed Claude Code with its existing login.
  - tool: codex-cli
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: cursor
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs the Cursor CLI agent with your Cursor account.
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      limits:
        - Parallel agents in local workspaces on your Mac
        - Bring your own subscriptions and keys
    - id: pro
      name: Pro
      price: 50
      audience: individual
      overage:
        kind: credits
      limits:
        - Conductor Cloud, multiplayer with up to 5 Pro users, Conductor API
      notes: Includes a bundle of Conductor Cloud workspace hours, amount not published on the pricing page
    - id: teams
      name: Teams
      price: 60
      audience: team
      overage:
        kind: credits
      limits:
        - Live collaboration for teams of any size, admin portal, centralized billing
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
  notes: Every plan uses your own agent subscriptions and keys. Paid plans add cloud workspaces and collaboration, not model usage.
status: active
sources:
  - url: https://conductor.build/pricing
    verified_at: 2026-08-23
    covers: [pricing, wraps]
  - url: https://conductor.build
    verified_at: 2026-08-23
    covers: [platforms, features, general]
