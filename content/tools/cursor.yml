slug: cursor
name: Cursor
description: The VS Code fork that popularised AI-native editing. Cursor 3 replaced Composer with an Agents window and Cursor Router picks models by cost, balance or intelligence.
layer: editor
secondary_layers: [harness, cloud]
vendor: Anysphere
homepage: https://cursor.com
links:
  docs: https://cursor.com/docs
  pricing: https://cursor.com/pricing
  changelog: https://cursor.com/changelog
icon: i-simple-icons-cursor
platforms: [macos, windows, linux]
install:
  - method: download
    url: https://cursor.com/download
  - method: brew
    command: brew install --cask cursor
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [anthropic, openai, google, xai, first-party]
  byok: partial
  local: false
  notes: Your own API keys work for chat but not for agent features on Cursor Router.
features: [parallel-agents, subagents, worktrees, mcp-client, hooks, plugins, browser-automation, diff-review, checkpoints, tab-completion, remote-execution, acp-agent]
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      limits:
        - Limited agent requests
        - Limited Chat requests
    - id: plus
      name: Plus
      price: 8
      audience: individual
      overage:
        kind: credits
        notes: The page says to keep going with top-offs once the included usage is spent, or wait for the weekly allowance to refresh.
      limits:
        - Introductory plan with a shared AI usage pool
        - Only Grok models are available on this plan
        - Grok Chat, Voice, Imagine and Build, and Grok API access
    - id: premium
      name: Premium
      price: 30
      audience: individual
      overage:
        kind: credits
        notes: The page says to keep going with top-offs once the included usage is spent, or wait for the weekly allowance to refresh.
      limits:
        - 4x more usage than Plus
        - Cloud agents and automations
        - Code hosting and AI code reviews with Bugbot
        - Third-party models at API list price
        - Grok Bot
    - id: super
      name: Super
      price: 100
      audience: individual
      overage:
        kind: credits
        notes: The page says to keep going with top-offs once the included usage is spent, or wait for the weekly allowance to refresh.
      limits:
        - 15x more usage than Plus
        - Priority model access at peak times
        - Cloud agents and automations
        - Code hosting and AI code reviews with Bugbot
        - Grok Bot
    - id: ultra
      name: Ultra
      price: 200
      audience: individual
      overage:
        kind: credits
        notes: The page says to keep going with top-offs once the included usage is spent, or wait for the weekly allowance to refresh.
      limits:
        - 50x more usage than Plus
        - Earliest access to all products and models
        - Priority model access at peak times
        - Cloud agents and automations
        - Code hosting and AI code reviews with Bugbot
        - Grok Bot
    - id: teams
      name: Teams
      price: 30
      price_from: true
      audience: team
      overage:
        kind: credits
        notes: The page says to keep going with top-offs once the included usage is spent, or wait for the weekly allowance to refresh.
      limits:
        - Usage of 4x to 50x Plus depending on the seat tier, with mix and match seat types (Premium, Super and Ultra seats)
        - Centralized billing and administration
        - Team marketplace for internal rules, skills, and plugins
        - SAML/OIDC SSO
        - Usage analytics
        - Team-wide privacy settings
        - Custom Chat data retention
        - Grok Bot
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Pooled usage
        - Invoice/PO billing
        - SCIM seat management
        - Repository, model, and MCP access controls
        - Auto-run, browser, and network controls
        - Audit logs and service accounts
        - Access, network, and audit controls for Grok Bot
  notes: Third-party model usage in Cursor is not included in the monthly prices and is purchased separately. Every tier includes a pool of AI usage shared across Cursor and Grok.
status: active
sources:
  - url: https://cursor.com/pricing
    verified_at: 2026-10-14
    covers: [pricing]
  - url: https://cursor.com/docs
    verified_at: 2026-08-23
    covers: [platforms, models, features]
  - url: https://cursor.com/docs/cli/acp
    verified_at: 2026-08-27
    covers: [features]
