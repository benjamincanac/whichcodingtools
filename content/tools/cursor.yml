slug: cursor
name: Cursor
description: The VS Code fork that popularised AI-native editing. Cursor 3 replaced Composer with an Agents window and Cursor Router picks models by cost, balance or intelligence.
layer: editor
secondary_layers: [harness, cloud]
vendor: Anysphere
homepage: https://cursor.com
links:
  docs: https://cursor.com/docs
  pricing: https://cursor.com/pricing
  changelog: https://cursor.com/changelog
icon: i-simple-icons-cursor
platforms: [macos, windows, linux]
install:
  - method: download
    url: https://cursor.com/download
  - method: brew
    command: brew install --cask cursor
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [anthropic, openai, google, xai, first-party]
  byok: partial
  local: false
  notes: Your own API keys work for chat but not for agent features on Cursor Router.
features: [parallel-agents, subagents, worktrees, mcp-client, hooks, plugins, browser-automation, diff-review, checkpoints, tab-completion, remote-execution, acp-agent]
pricing:
  tiers:
    - id: hobby
      name: Hobby
      price: 0
      audience: individual
      overage:
        kind: blocked
      limits:
        - No credit card required
        - Limited Agent requests
        - Access to Composer
    - id: pro
      name: Pro
      price: 20
      audience: individual
      included:
        amount: 20
        unit: usd
        usd_value: 20
        notes: Agent usage priced at model API rates, with Auto modes billed differently per Router mode
      overage:
        kind: api-list
        notes: Usage-based billing at API list price once the included amount is used, opt-in.
      limits:
        - Extended limits on Agent
        - Access to frontier models
        - Grok Bot access
        - MCPs, skills, and hooks
        - Cloud agents
        - Bugbot on usage-based billing
    - id: pro-plus
      name: Pro+
      price: 60
      audience: individual
      included:
        amount: 60
        unit: usd
        usd_value: 60
      overage:
        kind: api-list
      limits:
        - 3x the Pro agent limits
        - Access to frontier models
        - Higher Grok Bot usage limits
        - MCPs, skills, and hooks
        - Cloud agents
        - Bugbot on usage-based billing
    - id: ultra
      name: Ultra
      price: 200
      audience: individual
      overage:
        kind: api-list
      limits:
        - 20x the Pro agent limits
        - Access to frontier models
        - Highest Grok Bot usage limits
        - MCPs, skills, and hooks
        - Cloud agents
        - Bugbot on usage-based billing
        - Priority access to new features
    - id: teams
      name: Teams Standard
      price: 40
      audience: team
      overage:
        kind: api-list
      limits:
        - Centralized team billing and administration
        - Team marketplace for internal rules, skills, and plugins
        - Cloud agents and automations with shared team context
        - SAML/OIDC SSO
        - Agentic code reviews with Bugbot
        - Usage analytics to understand team behavior
        - Team-wide privacy mode
        - Grok Bot access
    - id: teams-premium
      name: Teams Premium
      price: 120
      audience: team
      overage:
        kind: api-list
      limits:
        - 5x the Teams Standard agent limits
        - Centralized team billing and administration
        - Team marketplace for internal rules, skills, and plugins
        - Cloud agents and automations with shared team context
        - Higher Grok Bot usage limits
        - Agentic code reviews with Bugbot
        - Usage analytics to understand team behavior
        - Team-wide privacy mode
        - SAML/OIDC SSO
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Pooled usage
        - Invoice/PO billing
        - SCIM seat management
        - Repository, model, and MCP access controls
        - Auto-run, browser, and network controls
        - Audit logs and service accounts
        - AI code tracking API
        - Access, network, and audit controls for Grok Bot
        - Priority support and account management
status: active
sources:
  - url: https://cursor.com/pricing
    verified_at: 2026-09-20
    covers: [pricing]
  - url: https://cursor.com/docs
    verified_at: 2026-08-23
    covers: [platforms, models, features]
  - url: https://cursor.com/docs/cli/acp
    verified_at: 2026-08-27
    covers: [features]
