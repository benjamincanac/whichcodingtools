slug: devin
name: Devin
description: Cognition's cloud software engineer. Works in its own VM from a Slack message, a ticket or the web app, and bills self-serve plans by quota, Enterprise by Agent Compute Units.
layer: cloud
vendor: Cognition
homepage: https://devin.ai
links:
  docs: https://docs.devin.ai
  pricing: https://devin.ai/pricing
platforms: [web]
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [first-party, anthropic, openai]
  byok: none
  local: false
features: [parallel-agents, sandboxing, browser-automation, mcp-client, scheduled-tasks, diff-review, acp-agent]
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      overage:
        kind: blocked
        notes: Free plan users must upgrade to a paid plan to buy on-demand credits.
      limits:
        - Limited Devin usage
        - Access to Devin Review
        - Access to DeepWiki
    - id: pro
      name: Pro
      price: 20
      audience: individual
      overage:
        kind: credits
        notes: On-demand credits fund usage past the quota, same dollar value as the legacy ACUs.
      limits:
        - Daily and weekly usage quota shared across Devin sessions, Devin CLI and Devin Desktop
        - Pay-as-you-go on-demand credits once the quota runs out
        - Slack, Linear and MCP integrations
    - id: max
      name: Max
      price: 200
      audience: individual
      overage:
        kind: credits
        notes: On-demand credits fund usage past the quota, same dollar value as the legacy ACUs.
      limits:
        - Everything in Pro
        - Significantly larger weekly usage quota than Pro, with no daily cap
    - id: teams
      name: Teams
      price: 40
      audience: team
      overage:
        kind: credits
        notes: Shared on-demand credits fund flex-seat usage and any full-seat usage past its quota.
      limits:
        - Every Teams account has an $80/month minimum
        - Full seat includes a Pro-equivalent quota and Devin Desktop access
        - Flex seats are free and unlimited, and draw only from the shared on-demand credit pool
        - Unlimited members
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Billed in Agent Compute Units at the rate set in the order form
        - Enterprise ACUs are distinct from self-serve quota and on-demand credits
  notes: Cognition replaced the ACU-priced Core/Team plans with self-serve Free/Pro/Max/Teams plans, each with a usage quota and pay-as-you-go on-demand credits; Enterprise still bills in ACUs per contract. devin.ai/pricing still returns HTTP 429 to automated fetches, this reads the docs.devin.ai self-serve and enterprise billing pages instead.
status: active
