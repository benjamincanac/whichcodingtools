slug: cline
name: Cline
description: Open source agent for VS Code, JetBrains and the terminal. Bring your own key for any provider, local models included, with an MCP marketplace and plan-then-act modes.
layer: extension
secondary_layers: [harness]
vendor: Cline Bot Inc.
homepage: https://cline.bot
links:
  docs: https://docs.cline.bot
  pricing: https://cline.bot/pricing
  repo: https://github.com/cline/cline
icon: i-simple-icons-cline
platforms: [macos, windows, linux]
hosts: [vscode, jetbrains]
install:
  - method: download
    url: https://marketplace.visualstudio.com/items?itemName=saoudrizwan.claude-dev
  - method: npm
    command: npm install -g cline
license:
  spdx: Apache-2.0
  kind: open-source
  repo: https://github.com/cline/cline
models:
  providers: [anthropic, openai, google, xai, mistral, deepseek, openrouter, vercel-ai-gateway]
  byok: full
  local: true
  notes: Any OpenAI-compatible endpoint, plus Bedrock, Azure and Vertex.
features: [mcp-client, plugins, checkpoints, browser-automation, hooks, subagents, acp-agent]
pricing:
  tiers:
    - id: free
      name: Open Source
      price: 0
      audience: individual
      limits:
        - VS Code Extension and CLI
        - Secure client-side architecture, model inference at cost or bring your own key
        - MCP Marketplace, multi-root workspaces, community support
    - id: clinepass
      name: ClinePass
      price: 9.99
      audience: individual
      notes: First month is $4.99 as an introductory promotion, then the standard rate of $9.99 per month applies. Additional processing fees may apply.
      limits:
        - Curated open weight models from Z.ai, Moonshot AI, DeepSeek, MiniMax, MiMo and Qwen
        - Generous quotas versus standard API rate limits, no separate provider keys needed
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - All Open Source features plus the JetBrains extension
        - SSO, SLA and dedicated support, centralized billing
        - Role based access control, limit inference providers, team management dashboard, authentication logs
      notes: Prices are not on the public site.
  notes: Cline itself is free and open source. ClinePass is an optional paid subscription for curated open weight model access. Enterprise is contact-sales for team and security features.
status: active
sources:
  - url: https://cline.bot/pricing
    verified_at: 2026-08-26
    covers: [pricing]
  - url: https://cline.bot/cline-pass
    verified_at: 2026-08-26
    covers: [pricing]
  - url: https://cline.bot
    verified_at: 2026-08-23
    covers: [platforms, models, features, license, general]
  - url: https://docs.cline.bot/usage/acp
    verified_at: 2026-08-27
    covers: [features]
