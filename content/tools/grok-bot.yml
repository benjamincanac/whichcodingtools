slug: grok-bot
name: Grok Bot
description: xAI's always-on cloud agents. Named bots share one persistent cloud computer per account with a browser, filesystem and terminal, and run in parallel. Signs in with Cursor.
layer: cloud
vendor: xAI (SpaceXAI)
homepage: https://x.ai/bot
links:
  docs: https://docs.x.ai/grok-bot/overview
  pricing: https://x.ai/bot
platforms: [macos, windows, ios]
install:
  - method: download
    url: https://x.ai/bot
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [xai]
  plans: [cursor, grok]
  byok: none
  local: false
  notes: The docs do not name which Grok model version powers Bots. Bots sign in with a Cursor account, and a linked individual SuperGrok, SuperGrok Plus or SuperGrok Heavy subscription also unlocks access without a paid Cursor plan. A linked X Premium+ subscription grants access too, at the entry level of usage.
features: [browser-automation, sandboxing, scheduled-tasks, parallel-agents, mcp-client]
pricing:
  tiers:
    - id: trial
      name: One-time trial
      price: 0
      audience: individual
      limits:
        - A one-time trial without a SuperGrok or Cursor subscription, length and allowance not published
    - id: supergrok
      name: SuperGrok
      price: 30
      price_annual: 25
      audience: individual
      mirrors:
        tool: grok-build
        tier: supergrok
      limits:
        - Included with an individual SuperGrok subscription, linked to your Cursor account, usage below SuperGrok Plus
    - id: supergrok-plus
      name: SuperGrok Plus
      price: 100
      price_annual: 83.33
      audience: individual
      mirrors:
        tool: grok-build
        tier: supergrok-plus
      limits:
        - Included with a SuperGrok Plus subscription, linked to your Cursor sign-in
    - id: supergrok-heavy
      name: SuperGrok Heavy
      price: 300
      price_annual: 250
      audience: individual
      mirrors:
        tool: grok-build
        tier: supergrok-heavy
      limits:
        - Included with a SuperGrok Heavy subscription, linked to your Cursor sign-in
    - id: cursor-pro
      name: Cursor Pro
      price: 20
      audience: individual
      mirrors:
        tool: cursor
        tier: pro
      limits:
        - Included with a Cursor Pro subscription, weekly usage below Pro+
    - id: cursor-pro-plus
      name: Cursor Pro+
      price: 60
      audience: individual
      mirrors:
        tool: cursor
        tier: pro-plus
      limits:
        - Included with a Cursor Pro+ subscription
    - id: cursor-ultra
      name: Cursor Ultra
      price: 200
      audience: individual
      mirrors:
        tool: cursor
        tier: ultra
      limits:
        - Included with a Cursor Ultra subscription
    - id: cursor-teams
      name: Cursor Teams
      price: 40
      audience: team
      mirrors:
        tool: cursor
        tier: teams
      limits:
        - Standard and Premium seats each get a weekly Grok Bot usage allowance, invoices combine Cursor and Grok Bot charges
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      limits:
        - Access is given to all team members or limited to specific groups with Manage Group Access
  notes: Grok Bot has no standalone price. It signs in with a Cursor account and is unlocked by a paid individual Cursor plan (Pro, Pro+ or Ultra), a Cursor Teams seat, an individual SuperGrok, SuperGrok Plus or SuperGrok Heavy subscription linked to that Cursor account, or a one-time trial. An X Premium+ subscription also links, at entry level usage.
status: preview
