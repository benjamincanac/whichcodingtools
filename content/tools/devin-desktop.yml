slug: devin-desktop
name: Devin Desktop
description: Cognition's AI-native IDE, renamed from Windsurf over the air on 2 June 2026. Devin Local, a Rust rewrite of the Cascade agent, adds sub-agents and sandboxing.
layer: editor
vendor: Cognition
homepage: https://devin.ai/desktop
links:
  docs: https://docs.devin.ai
  pricing: https://devin.ai/pricing
platforms: [macos, windows, linux]
install:
  - method: download
    url: https://devin.ai/desktop
license:
  spdx: proprietary
  kind: proprietary
models:
  providers: [anthropic, openai, google, xai, first-party]
  byok: partial
  local: false
features: [parallel-agents, subagents, sandboxing, mcp-client, tab-completion, diff-review, browser-automation, acp-client]
wraps:
  - tool: claude-code
    via: acp
    uses_subscription: true
    min_tier: pro
    notes: Listed as Claude Agent. Billing and terms are between you and the agent provider, not Cognition.
  - tool: codex-cli
    via: acp
    uses_subscription: true
    min_tier: pro
  - tool: gemini-cli
    via: acp
    uses_subscription: true
    min_tier: pro
  - tool: junie-cli
    via: acp
    uses_subscription: true
    min_tier: pro
  - tool: opencode
    via: acp
    uses_subscription: true
    min_tier: pro
pricing:
  same_as: devin
  notes: Devin Desktop is billed on the same Free/Pro/Max/Teams self-serve plans as Devin; a Pro or Max plan, or a Teams full seat, includes Devin Desktop access.
status: active
aliases:
  - slug: windsurf
    name: Windsurf
    until: 2026-06-02
    note: Renamed to Devin Desktop by Cognition and updated in place. windsurf.com/editor redirects to devin.ai/desktop.
  - slug: codeium
    name: Codeium
    until: 2025-04-15
    note: The company and product were called Codeium before the Windsurf rebrand.
sources:
  - url: https://docs.devin.ai/admin/billing/self-serve
    verified_at: 2026-08-28
    covers: [pricing]
  - url: https://devin.ai/desktop
    verified_at: 2026-08-23
    covers: [platforms, models, features, general]
  - url: https://docs.devin.ai/desktop/acp
    verified_at: 2026-08-27
    covers: [features]
