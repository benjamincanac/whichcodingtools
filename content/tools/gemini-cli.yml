slug: gemini-cli
name: Gemini CLI
description: Google's open source terminal agent for Gemini models. Since 18 June 2026 it only serves paid Gemini API keys and Vertex AI, Google points individuals to Antigravity CLI.
layer: harness
vendor: Google
homepage: https://geminicli.com
links:
  docs: https://geminicli.com/docs
  repo: https://github.com/google-gemini/gemini-cli
icon: i-simple-icons-googlegemini
platforms: [macos, linux, windows]
install:
  - method: npm
    command: npm install -g @google/gemini-cli
  - method: brew
    command: brew install gemini-cli
license:
  spdx: Apache-2.0
  kind: open-source
  repo: https://github.com/google-gemini/gemini-cli
models:
  providers: [google]
  byok: full
  local: false
  notes: Google account sign-in, the free tier and Google AI Pro and Ultra access stopped on 18 June 2026.
features: [mcp-client, hooks, plugins, checkpoints, sandboxing, subagents, acp-agent]
pricing:
  tiers:
    - id: api
      name: Gemini API key or Vertex AI
      price: null
      audience: individual
      overage:
        kind: api-list
  notes: The free personal tier and Google AI Pro and Ultra sign-in stopped serving requests on 18 June 2026. The CLI keeps working with paid Gemini and Gemini Enterprise Agent Platform API keys. Antigravity CLI is Google's successor for individuals.
status: active
sources:
  - url: https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli
    verified_at: 2026-08-23
    covers: [pricing, models]
  - url: https://github.com/google-gemini/gemini-cli
    verified_at: 2026-08-23
    covers: [platforms, features, license]
