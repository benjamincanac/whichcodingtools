slug: crush
name: Crush
description: Terminal coding agent from Charm, written in Go. Works with almost any model provider through your own API keys, plus an optional first-party Hyper plan.
layer: harness
vendor: Charmbracelet, Inc.
homepage: https://github.com/charmbracelet/crush
links:
  docs: https://github.com/charmbracelet/crush/blob/main/docs/config
  pricing: https://hyper.charm.land
  repo: https://github.com/charmbracelet/crush
platforms: [macos, windows, linux, android]
install:
  - method: brew
    command: brew install charmbracelet/tap/crush
  - method: npm
    command: npm install -g @charmland/crush
  - method: winget
    command: winget install charmbracelet.crush
  - method: aur
    command: yay -S crush-bin
  - method: download
    url: https://github.com/charmbracelet/crush/releases
license:
  spdx: FSL-1.1-MIT
  kind: source-available
  repo: https://github.com/charmbracelet/crush
  notes: Functional Source License, converts to MIT after two years per release.
models:
  providers: [first-party, anthropic, openai, google, zhipu, minimax, openrouter, vercel-ai-gateway, alibaba, moonshot]
  byok: full
  local: true
  notes: Paste an API key for Anthropic, OpenAI, Gemini, OpenRouter, Vercel AI Gateway, MiniMax, Z.ai, Moonshot, Alibaba and more, or run local models through Ollama, llama.cpp, LM Studio or OMLX. Amazon Bedrock and Google Vertex AI are supported through their own credential chains. Hyper is Charm's own first-party inference plan.
features: [mcp-client, hooks]
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      limits:
        - Use Crush with your own provider API keys, no Hyper plan required
