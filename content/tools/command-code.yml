slug: command-code
name: Command Code
description: Terminal coding agent and desktop app that learns a developer's coding taste and gives access to open and frontier models.
layer: harness
secondary_layers: [app]
vendor: Langbase, Inc.
homepage: https://commandcode.ai
links:
  docs: https://commandcode.ai/docs
  pricing: https://commandcode.ai/pricing
  changelog: https://commandcode.ai/changelog
  repo: https://github.com/CommandCodeAI/command-code
  discord: https://commandcode.ai/discord
  x: https://x.com/CommandCodeAI
platforms: [macos, windows, linux]
install:
  - method: npm
    command: npm install -g command-code
  - method: download
    url: https://commandcode.ai/desktop
license:
  spdx: proprietary
  kind: proprietary
  repo: https://github.com/CommandCodeAI/command-code
  notes: Operated by Langbase, Inc. d/b/a Command Code. The CLI source is visible in a public GitHub repo but the npm package lists the license as UNLICENSED, so no open license is granted.
models:
  providers: [anthropic, openai, google, xai, deepseek, moonshot, alibaba, zhipu, minimax]
  plans: [chatgpt, copilot]
  byok: full
  local: true
  notes: Ships curated first-party access to Claude, GPT, Gemini, Grok, DeepSeek, Kimi, Qwen, GLM, Tencent Hunyuan and MiniMax models. BYOK connects any OpenAI or Anthropic-compatible endpoint, including local servers like Ollama or vLLM, or a ChatGPT Pro/Plus or GitHub Copilot subscription.
features: [worktrees, subagents, mcp-client, hooks, checkpoints, scheduled-tasks, plugins]
pricing:
  tiers:
    - id: go
      name: Go
      price: 1
      per: flat
      audience: individual
      included:
        amount: 10
        unit: usd
        period: month
        notes: Deals on some models can raise effective usage to up to $20.
      overage:
        kind: api-list
        notes: Extra credits can be bought on demand at the underlying model API rate, with optional auto-reload.
      limits:
        - Around 15K requests a month
        - Standard rate limits and limited usage analytics
        - Discord community support
    - id: goat
      name: GOAT
      price: 10
      per: flat
      audience: individual
      included:
        amount: 70
        unit: usd
        period: month
        notes: Per-model credit allowances across 29+ models, up to $70 of usage on each. Deals on some models can raise effective usage to up to ~$100.
      overage:
        kind: api-list
        notes: Extra credits can be bought on demand at the underlying model API rate, with optional auto-reload.
      limits:
        - Around 75K requests a month
        - Standard rate limits, usage analytics
        - Discord community support
    - id: pro
      name: Pro
      price: 20
      per: flat
      audience: individual
      included:
        amount: 80
        unit: usd
        period: month
      overage:
        kind: api-list
        notes: Extra credits can be bought on demand at the underlying model API rate, with optional auto-reload.
      limits:
        - Around 100K requests a month
        - Part of the $80 credit allowance is earmarked for premium models (Claude Sonnet, GPT and Gemini)
        - Standard rate limits, usage analytics
        - Discord community support
    - id: max-10x
      name: Max 10x
      price: 100
      per: flat
      audience: individual
      included:
        amount: 150
        unit: usd
        period: month
        notes: Deals on some models can raise effective usage to up to $300.
      overage:
        kind: api-list
        notes: Extra credits can be bought on demand at the underlying model API rate, with optional auto-reload.
      limits:
        - Around 219K requests a month
        - Open source and premium models
        - Higher rate limits
        - Priority support
    - id: max-20x
      name: Max 20x
      price: 200
      per: flat
      audience: individual
      included:
        amount: 300
        unit: usd
        period: month
        notes: Deals on some models can raise effective usage to up to $600.
      overage:
        kind: api-list
        notes: Extra credits can be bought on demand at the underlying model API rate, with optional auto-reload.
      limits:
        - Around 437K requests a month
        - Open source and premium models, no caps on model choice
        - Highest rate limits
        - Priority support
    - id: provider
      name: Provider
      price: 15
      per: flat
      audience: individual
      overage:
        kind: api-list
        markup_pct: 0
        notes: Pay-as-you-go OpenAI and Anthropic compatible API access billed at the underlying model API rate, on top of the $15 base fee.
      limits:
        - OpenAI and Anthropic compatible API endpoints for any client
        - Open source and premium models
        - Per-request usage analytics
        - Discord community support
    - id: teams
      name: Teams
      price: 40
      per: flat
      audience: team
      limits:
        - Around 35K requests a month, pooled in one bucket for the whole team
        - Open source and premium models
        - Team collaboration and management, shared billing and central admin
        - Priority support
    - id: enterprise
      name: Enterprise
      price: null
      per: flat
      audience: enterprise
      contact_sales: true
      limits:
        - Everything in Max, plus custom credits and seats
        - Unlimited team seats, dedicated support engineer
        - SLA guarantees and priority infrastructure
        - Custom training and onboarding
  notes: Each paid tier bills a flat monthly fee plus a processing fee. Select premium models (GPT-5.6 Luna, Grok 4.5, Qwen Max and Plus) are included on every plan, and top-up credits roll over and never expire.
