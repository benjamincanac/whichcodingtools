slug: superset
name: Superset
description: Source-available desktop app that runs many CLI agents in parallel, one git worktree per workspace, with a diff dashboard, SSH workspaces and scheduled automations.
layer: orchestrator
vendor: Superset
homepage: https://superset.sh
links:
  docs: https://docs.superset.sh
  pricing: https://superset.sh/pricing
  repo: https://github.com/superset-sh/superset
platforms: [macos, linux]
install:
  - method: download
    url: https://superset.sh/download
  - method: brew
    command: brew install superset-sh/tap/superset
  - method: curl
    command: curl -fsSL https://superset.sh/cli/install.sh | sh
license:
  spdx: Elastic-2.0
  kind: source-available
  repo: https://github.com/superset-sh/superset
  notes: Elastic License 2.0. Public code, not OSI approved.
models:
  byok: full
  local: false
  notes: Inherits whatever the wrapped agent is signed in with. Superset is not a model provider.
features: [parallel-agents, worktrees, diff-review, remote-execution, scheduled-tasks]
wraps:
  - tool: claude-code
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs your installed Claude Code with its existing login on every plan.
  - tool: codex-cli
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: gemini-cli
    via: cli
    uses_subscription: true
    min_tier: free
  - tool: cursor
    via: cli
    uses_subscription: true
    min_tier: free
    notes: Runs the Cursor CLI agent with your Cursor account.
  - tool: opencode
    via: cli
    uses_subscription: true
    min_tier: free
pricing:
  tiers:
    - id: free
      name: Free
      price: 0
      audience: individual
      limits:
        - 1 user, local workspaces, desktop app, CLI
    - id: pro
      name: Pro
      price: 20
      price_annual: 16
      audience: team
      limits:
        - Unlimited users, remote access, automations, mobile, Linear and Slack integrations
    - id: team
      name: Team
      price: 60
      price_annual: 54
      audience: team
      overage:
        kind: fixed
        rate: 0.06
        notes: Per GB-hour past the shared cloud pool. Extra GB-hours can be bought as needed and never expire.
      limits:
        - 1,200 cloud GB-hours per seat each month, one shared pool for the team (beta)
    - id: ultra
      name: Ultra
      price: 200
      audience: team
      overage:
        kind: fixed
        rate: 0.06
        notes: Per GB-hour past the shared cloud pool. Extra GB-hours can be bought as needed and never expire.
      limits:
        - 4,000 cloud GB-hours per seat each month, 3.3x Team, one shared pool for the team (beta)
    - id: enterprise
      name: Enterprise
      price: null
      contact_sales: true
      audience: enterprise
      notes: Annual billing only. Everything in Ultra, SAML SSO, SCIM, audit logs, SOC 2 Type II report, uptime SLA, custom integrations.
  notes: Paid plans add remote workspaces and team features, not model usage. Pro is billed per active seat. Copilot and any other CLI agent also run. Windows is not available yet and an iOS app is listed as coming soon.
status: active
sources:
  - url: https://superset.sh/pricing
    verified_at: 2026-10-23
    covers: [pricing, wraps]
  - url: https://superset.sh
    verified_at: 2026-08-23
    covers: [platforms, features, license, general]
  - url: https://github.com/superset-sh/superset
    verified_at: 2026-08-23
    covers: [license, platforms, features]
