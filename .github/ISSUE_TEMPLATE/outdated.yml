name: Outdated data
description: A price, platform or integration on the site no longer matches the vendor page.
title: "[Outdated] "
labels: [outdated]
body:
  - type: input
    id: tool
    attributes:
      label: Tool slug
      description: The last part of its page URL, /tools/cursor is `cursor`.
      placeholder: cursor
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What is wrong
      description: What the site says and what the vendor page says now.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Vendor page that shows the current value
      description: Optional. Left blank, the pricing and docs links already on file are re-read.
  - type: input
    id: field
    attributes:
      label: Field
      description: Optional. The schema path, when you know it.
      placeholder: pricing.tiers.pro.price
