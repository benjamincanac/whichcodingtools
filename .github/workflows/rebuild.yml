name: rebuild

# The site is static, so freshness badges freeze at build time.
# A daily rebuild keeps "verified N days ago" honest. Needs a Vercel deploy hook
# in the VERCEL_DEPLOY_HOOK_URL secret; the job is a no-op without it.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
